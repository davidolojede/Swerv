<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin-login/admin-login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="login-container">
        <div class="vector-container">
            <!-- <h1 id="catchphrase">Store Management</h1> -->
            <img src="/assets/admin-log-vector-two.png" alt="">
        </div>
        <div class="form-container">
            <p id="display-error"></p>
            <div class="logo-container">
                <h2 id="form-logo">Swerv</h2>
            </div>


            <div class="form">
                <h2>Login</h2>

                <div class="note">
                    <h3>Welcome back, Admin!</h3>
                    <p>Enter your admin credentials to access the dashboard and manage store operations.</p>
                </div>

                <div class="inputs">
                    <div class="email-container">
                        <label for="admin-email">Email</label>
                        <div class="input-container">
                            <input id="admin-email" type="email" placeholder="johndoe@example.com">
                            <i class="bi bi-person-fill email-icon form-icon"></i>
                        </div>
                    </div>
                    <div class="pass-container">
                        <label for="admin-pass">Password</label>
                        <div class="input-container">
                            <input id="admin-pass" type="password" placeholder="********">
                            <i class="bi bi-lock-fill pass-icon form-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="log-cache">
                    <input type="checkbox" id="cache-info">
                    <label for="cache-info">Remember me</label>
                </div>

                <button onclick="logInAdmin()" id="sign-in-btn">Sign In</button>
                <p id="join-admin">Don't have an account? Contact Head Admin</p>

            </div>
        </div>
    </div>
    <script src="/admin/admin-login/admin-login.js"></script>
</body>

</html>
