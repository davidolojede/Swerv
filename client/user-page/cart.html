<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Swerv</title>
    <link rel="stylesheet" href="/client/user-page/shop.css">
    <link rel="stylesheet" href="/client/user-page/cart.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- CART NAV -->
    <nav class="cart-nav">
        <div class="left-nav">
            <a href="./homepage.html">
                <h2>Swerv</h2>
            </a>
        </div>

        <div class="center-nav">
            <ul class="nav-list">
                <li><a href="./homepage.html#collection">Collections</a></li>
                <li><a href="./shop.html">Shop</a></li>
                <li><a href="./homepage.html#reviews-container">Reviews</a></li>
            </ul>
        </div>

        <div class="right-nav">
            <div class="cart-icon-container">
                <i class="bi bi-handbag-fill nav-icon"></i>
                <span id="cart-count">0</span>
            </div>
            <i class="bi bi-person nav-icon"></i>
        </div>
    </nav>

    <!-- CART MAIN -->
    <main class="cart-main">
        <div class="cart-header">
            <h1>YOUR CART</h1>
            <p id="cart-item-summary">0 items</p>
        </div>

        <!-- CART CONTENT -->
        <div class="cart-page-container">

            <div class="cart-items-panel">
                <div id="cart-items-list">
                    <!-- CART ITEMS LIST -->
                </div>

                <div id="cart-empty-state" class="cart-empty-state">
                    <i class="bi bi-handbag"></i>
                    <h3>Your cart is empty</h3>
                    <p>Add a pair you like and it'll show up here.</p>
                    <a href="./shop.html" class="continue-shopping-btn">Continue shopping</a>
                </div>
            </div>

            <!-- ORDER SUMMARY PANEL -->
            <aside class="cart-summary-panel">
                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₦0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span class="summary-muted">Calculated at checkout</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="cart-total">₦0</span>
                </div>

                <button id="checkout-btn" class="checkout-btn">Checkout</button>
                <a href="./shop.html" class="keep-shopping-link">Continue shopping</a>
            </aside>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Swerv. All rights reserved.</p>
    </footer>
</body>
<script type="module" src="./cart.js"></script>

</html>
